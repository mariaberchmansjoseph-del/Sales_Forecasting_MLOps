
name: Sales Forecasting MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  data-registration:
    name: "Step 1 — Data Registration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pandas huggingface-hub
      - name: Register Data
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          HF_USERNAME:     ${{ secrets.HF_USERNAME }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python scripts/register_data.py

  data-preparation:
    name: "Step 2 — Data Preparation"
    runs-on: ubuntu-latest
    needs: data-registration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pandas numpy scikit-learn huggingface-hub
      - name: Prepare Data
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          HF_USERNAME:     ${{ secrets.HF_USERNAME }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python scripts/prepare_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            data/train.csv
            data/test.csv
            models/encoding_map.json
          retention-days: 1

  model-training:
    name: "Step 3 — Model Training"
    runs-on: ubuntu-latest
    needs: data-preparation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .
      - name: Train Models
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          HF_USERNAME:     ${{ secrets.HF_USERNAME }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          HF_MODEL_REPO:   ${{ secrets.HF_MODEL_REPO }}
        run: python scripts/train_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/best_model.pkl
            models/model_metadata.json
            models/encoding_map.json
          retention-days: 7

  commit-model:
    name: "Step 4 — Commit Model to Repo"
    runs-on: ubuntu-latest
    needs: model-training
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --staged --quiet || git commit -m \
            "ci: update trained model [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-huggingface:
    name: "Step 5 — Deploy to HuggingFace"
    runs-on: ubuntu-latest
    needs: commit-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
      - run: pip install huggingface-hub
      - name: Deploy App to HuggingFace Space
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
          HF_MODEL_REPO: ${{ secrets.HF_MODEL_REPO }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api      = HfApi()
          token    = os.environ["HF_TOKEN"]
          username = os.environ["HF_USERNAME"]
          repo_id  = f"{username}/{os.environ['HF_SPACE_REPO']}"

          readme = """---
title: Sales Forecasting App
emoji: 📊
colorFrom: blue
colorTo: green
sdk: gradio
sdk_version: 4.44.0
app_file: app.py
pinned: false

# Sales Forecasting MLOps Pipeline

          with open("/tmp/README.md", "w") as f:
              f.write(readme)

          reqs = "pandas\nnumpy\nscikit-learn\nxgboost\njoblib\ngradio\nhuggingface-hub\nspaces\n"
          with open("/tmp/reqs.txt", "w") as f:
              f.write(reqs)

          uploads = [
              ("/tmp/README.md",  "README.md"),
              ("app/app.py",      "app.py"),
              ("/tmp/reqs.txt",   "requirements.txt"),
          ]
          for mf in ["best_model.pkl",
                     "model_metadata.json",
                     "encoding_map.json"]:
              lp = f"models/{mf}"
              if os.path.exists(lp):
                  uploads.append((lp, f"models/{mf}"))

          for lp, rp in uploads:
              api.upload_file(
                  path_or_fileobj=lp, path_in_repo=rp,
                  repo_id=repo_id, repo_type="space",
                  token=token
              )
              print(f"  ✓ {rp}")

          print(f"Done: https://huggingface.co/spaces/{repo_id}")
        
